<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap">
    <link rel="stylesheet" href="styles.css">
    <title>Cards</title>


</head>

<body>

    <div class="card_display">
    <div class="card">
        <div class="card_item">
            <img class="card_img" src="galochka.avif" alt="check mark">
        <h2>Base subscription</h2>
        <ul>
            <li class="succes"> Bonus 1</li>
            <li class="cross"> Bonus 2</li>
            <li class="cross"> Bonus 3</li>
        </ul>
        </div>
        <div class="footecard">$ 199/per month</div>
        <button>Select</button>
        
    </div>

    <div class="card">
        <div class="card_item">
            <img class="card_img" src="strela.avif" 
            alt="arrow">
        <h2>Advanced subscription</h2>
        <ul>
            <li class="succes"> Bonus 1</li>
            <li class="succes"> Bonus 2</li>
            <li class="cross"> Bonus 3</li>
        </ul>
        </div>
        <div class="footecard">$ 299/per month</div>
        <button>Select</button>
       
    </div>

    <div class="card">
        <div class="card_item">
            <img class="card_img" src="corona.jpg" alt="crown">
        <h2>Premium subscription</h2>
        <ul>
            <li class="succes"> Bonus 1</li>
            <li class="succes"> Bonus 2</li>
            <li class="succes"> Bonus 3</li>
        </ul>
        </div>
        <div class="footecard">$ 599/per month</div>
        <button>Select</button>
        
    </div>
</div>
</body>

</html>
